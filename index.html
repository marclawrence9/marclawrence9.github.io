

<!-- Place inside your existing <body> -->
<div class="mystic-player">
  <span class="music-orb">✦</span>
  <div class="music-info">
    <strong>THE AVENGERS</strong>
    <small>Multiverse Soundtrack</small>
  </div>
  <audio id="avengersAudio" src="assets/avengers-theme.mp3"
         preload="none" loop></audio>
  <button id="musicToggle" type="button"
          aria-pressed="false">
    ▶ PLAY
  </button>
</div>

<style>
.mystic-player {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 9999;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  border: 1px solid #d99b42;
  border-radius: 18px;
  background: rgba(10, 9, 24, .94);
  color: #fff1c9;
  box-shadow: 0 0 25px #b65bff40;
  backdrop-filter: blur(12px);
}
.music-orb {
  color: #ff9d37;
  font-size: 28px;
  animation: mysticGlow 2s infinite alternate;
}
.music-info { display: grid; gap: 4px; }
.music-info small { color: #b6a9d6; }
.mystic-player button {
  padding: 10px 13px;
  border: 1px solid #ffae45;
  border-radius: 10px;
  background: #5425a2;
  color: white;
  cursor: pointer;
}
@keyframes mysticGlow {
  from { text-shadow: 0 0 5px #ff8c2b; }
  to { text-shadow: 0 0 20px #ff8c2b, 0 0 30px #a34dff; }
}
@media (max-width: 480px) {
  .mystic-player { right: 10px; bottom: 10px; gap: 8px; padding: 10px; }
  .music-info { max-width: 105px; font-size: 12px; }
}
</style>

<script>
const audio = document.getElementById("avengersAudio");
const button = document.getElementById("musicToggle");

button.addEventListener("click", async () => {
  if (audio.paused) {
    try {
      await audio.play();
      button.textContent = "Ⅱ PAUSE";
      button.setAttribute("aria-pressed", "true");
    } catch {
      button.textContent = "▶ RETRY";
      alert("Add your licensed MP3 file to assets/avengers-theme.mp3 first.");
    }
  } else {
    audio.pause();
    button.textContent = "▶ PLAY";
    button.setAttribute("aria-pressed", "false");
  }
});

audio.addEventListener("ended", () => {
  button.textContent = "▶ PLAY";
  button.setAttribute("aria-pressed", "false");
});
</script>

</body>
</html>
